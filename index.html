<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Obra Maricy">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Obra CBE Maricy</title>
<style>html,body{margin:0;height:100%;background:#f6f3ee;font:15px -apple-system,sans-serif;color:#8a857a}#c{height:100%;display:grid;place-items:center;text-align:center}#c img{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 12px}</style>
</head>
<body>
<div id="c"><div><img src="icon-180.png" alt=""><span id="m">Abrindo a obra…</span></div></div>
<script>
var API='https://script.google.com/macros/s/AKfycbxXmCF8DtkqBHjsZcog2pE4uMNFFsmrkD8jdb_2QawuHG7eJ8tyvNBinCOW_U8hcss/exec', CK='obra_pagina';
function abrir(html){
  html=html.replace(/<head([^>]*)>/i,'<head$1><script>window.OBRA_API='+JSON.stringify(API)+'<\/script><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.json">');
  document.open();document.write(html);document.close();
}
var cache=null;try{cache=localStorage.getItem(CK)}catch(e){}
var rede=fetch(API+'?acao=pagina&t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
  if(t.indexOf('<html')<0)throw 0;
  try{localStorage.setItem(CK,t)}catch(e){}
  return t});
if(cache){abrir(cache);rede.catch(function(){})}
else rede.then(abrir).catch(function(){document.getElementById('m').textContent='Sem conexão. Tente de novo.'});
</script>
</body>
</html>
